name: seed_mobile
description: SeedVision Mobile App - Flutter cross-platform client
publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.0
  
  # State management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.1.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  
  # UI
  google_fonts: ^6.1.0
  
  # Utils
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4
  image: ^4.8.0
  flutter_onnxruntime: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/best_mobile_yolo26_640.onnx
